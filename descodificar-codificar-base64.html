<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codificador e Descodificador Base64</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #007bff;
            --primary-hover: #0056b3;
            --text: #333333;
            --border: #cccccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: #222;
        }

        .group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            resize: vertical;
            font-family: monospace;
            box-sizing: border-box;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.secondary {
            background-color: #6c757d;
        }

        button.secondary:hover {
            background-color: #5a6268;
        }

        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Conversor Base64</h1>
    
    <div class="group">
        <label for="input">Texto Original / Base64:</label>
        <textarea id="input" placeholder="Digite o texto normal para codificar ou o código Base64 para descodificar..."></textarea>
    </div>

    <div class="actions">
        <button onclick="processar('codificar')">Codificar 🔒</button>
        <button onclick="processar('descodificar')">Descodificar 🔓</button>
        <button class="secondary" onclick="limpar()">Limpar</button>
    </div>

    <div class="group">
        <label for="output">Resultado:</label>
        <textarea id="output" readonly placeholder="O resultado aparecerá aqui..."></textarea>
        <div id="error-msg" class="error">Erro: Código Base64 inválido.</div>
    </div>
</div>

<script>
    // Converte string UTF-8 para Base64 de forma segura
    function utf8_to_b64(str) {
        return btoa(unescape(encodeURIComponent(str)));
    }

    // Converte Base64 para string UTF-8 de forma segura
    function b64_to_utf8(str) {
        return decodeURIComponent(escape(atob(str)));
    }

    function processar(acao) {
        const input = document.getElementById('input').value;
        const output = document.getElementById('output');
        const errorMsg = document.getElementById('error-msg');
        
        errorMsg.style.display = 'none';

        if (!input.trim()) {
            output.value = '';
            return;
        }

        try {
            if (acao === 'codificar') {
                output.value = utf8_to_b64(input);
            } else if (acao === 'descodificar') {
                // Remove espaços ou quebras de linha acidentais do Base64
                const sanitizedInput = input.replace(/\s+/g, '');
                output.value = b64_to_utf8(sanitizedInput);
            }
        } catch (e) {
            output.value = '';
            errorMsg.style.display = 'block';
        }
    }

    function limpar() {
        document.getElementById('input').value = '';
        document.getElementById('output').value = '';
        document.getElementById('error-msg').style.display = 'none';
    }
</script>

</body>
</html>
